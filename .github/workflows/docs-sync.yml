name: Reusable docs-sync

# Deprecated: docs-sync moved to the in-house Gillen agent in
# cartridge-gg/internal#4422. This workflow is kept as a no-op so caller
# repos that still reference it resolve cleanly while their own
# `docs-sync.yml` files are removed in follow-up PRs.

on:
  workflow_call:
    inputs:
      target-docs-repo:
        required: true
        type: string
      source-repo-slug:
        required: true
        type: string
      diff-globs:
        required: true
        type: string
      docs-patterns:
        required: true
        type: string
      canonical-desc:
        required: true
        type: string
      docs-structure-desc:
        required: true
        type: string

jobs:
  docs-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Deprecated — handled by Gillen
        run: |
          echo "docs-sync via GitHub Actions is deprecated."
          echo "Docs updates for ${{ inputs.source-repo-slug }} are now handled by the Gillen agent."
          echo "Remove the caller workflow in ${{ inputs.source-repo-slug }} to silence this run."
